name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-tag
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
      - run: |
          go build ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The commit's v0.2.N if it has one, else the next number, reserved on it.
      - name: Number the release
        id: version
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: v0.2
          publish: 'true'
      - name: Create module release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $h = @{Authorization="token $env:TOKEN"}
          $existing = Invoke-RestMethod "$api/releases/tags/$env:TAG" -Headers $h -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -notin 200,404) { throw "Release lookup returned HTTP $code" }
          if ($code -eq 200) { Write-Host "$env:TAG is already released: $($existing.html_url)"; exit 0 }
          $body = @{tag_name=$env:TAG; target_commitish=$env:GITHUB_SHA; name=$env:TAG; body="Engine release. $(git log --oneline -1)"} | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post "$api/releases" -Headers $h -ContentType application/json -Body $body
          Write-Host "$($release.html_url) at $env:GITHUB_SHA"
