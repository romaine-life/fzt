name: Build

# Auto-trigger disabled — Claude-driven CI. Run manually via
# `gh workflow run build.yml -R romaine-life/fzt` when ready to cut a new
# release. Downstream consumers (fzt-frontend, fzt-terminal) are also
# Claude-driven — bump their own go.mod via each repo's dispatch.yml.
#
# The release is a Go-module tag only. The `fzt` binary is built and
# released by fzt-terminal (cmd/fzt), which owns the TUI.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./... && go test ./core/...
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count from tags, not releases: a module tag pushed without a
          # release (v0.2.74) would otherwise be reused, and gh release create
          # attaches to the existing tag's old commit.
          latest=$(git tag -l 'v0.2.*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.2.0"
          else
            patch=$(echo "$latest" | sed 's/v[0-9]*\.[0-9]*\.//')
            next="v0.2.$((patch + 1))"
          fi
          gh release create "$next" \
            -R ${{ github.repository }} \
            --title "$next" \
            --notes "Engine release. $(git log --oneline -1)"
